openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Afrlance freelance marketplace API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: profiles
    description: User profiles
  - name: jobs
    description: Job listings
  - name: services
    description: Local and professional services
  - name: proposals
    description: Job proposals
  - name: messages
    description: Messaging
  - name: notifications
    description: Notifications
  - name: reviews
    description: Reviews and ratings
  - name: dashboard
    description: Dashboard summaries
  - name: payments
    description: Mock payment transactions
  - name: admin
    description: Admin operations
  - name: storage
    description: File storage operations

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: A required service is unavailable

  # Profiles
  /profiles/me:
    get:
      operationId: getMyProfile
      tags: [profiles]
      summary: Get current user's profile
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyProfile"
        "404":
          description: Profile not found
    put:
      operationId: upsertMyProfile
      tags: [profiles]
      summary: Create or update current user's profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertProfileBody"
      responses:
        "200":
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyProfile"

  /profiles/{id}:
    get:
      operationId: getProfile
      tags: [profiles]
      summary: Get a profile by user ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "404":
          description: Not found
  /profiles/{profileId}/reports:
    post:
      operationId: reportProfile
      tags: [profiles]
      summary: Report a public profile to the moderation team
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrustReportBody"
      responses:
        "201":
          description: Report submitted
        "400":
          description: Invalid report or reporting your own profile
        "401":
          description: Authentication required
        "404":
          description: Profile not found

  /profiles/freelancers:
    get:
      operationId: listFreelancers
      tags: [profiles]
      summary: List freelancer profiles with filters
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: skill
          in: query
          schema:
            type: string
        - name: location
          in: query
          schema:
            type: string
        - name: minRate
          in: query
          schema:
            type: number
        - name: maxRate
          in: query
          schema:
            type: number
        - name: minFixedRate
          in: query
          schema:
            type: number
        - name: maxFixedRate
          in: query
          schema:
            type: number
        - name: search
          in: query
          schema:
            type: string
        - name: featured
          in: query
          schema:
            type: boolean
        - name: limit
          in: query
          schema:
            type: integer
        - name: offset
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of freelancers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FreelancerListResponse"

  # Local services
  /services:
    get:
      operationId: listServices
      tags: [services]
      summary: List local service providers
      parameters:
        - name: query
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
        - name: region
          in: query
          schema:
            type: string
        - name: city
          in: query
          schema:
            type: string
        - name: latitude
          in: query
          description: Customer location latitude, requested only after location permission is granted
          schema:
            type: number
            minimum: -90
            maximum: 90
        - name: longitude
          in: query
          description: Customer location longitude, requested only after location permission is granted
          schema:
            type: number
            minimum: -180
            maximum: 180
        - name: withinKm
          in: query
          description: Optionally limit results to a radius around the supplied customer location
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Paginated service listings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceListResponse"
    post:
      operationId: createService
      tags: [services]
      summary: Create a local service listing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateServiceBody"
      responses:
        "201":
          description: Service created
          content:
            application/json:
              schema:
                type: object
                properties:
                  service:
                    $ref: "#/components/schemas/Service"
                required: [service]
        "401":
          description: Authentication required
        "403":
          description: Service-provider role required

  /services/my:
    get:
      operationId: listMyServices
      tags: [services]
      summary: List the current provider's service listings
      responses:
        "200":
          description: Current user's service listings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceListResponse"
        "401":
          description: Authentication required

  /services/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    get:
      operationId: getService
      tags: [services]
      summary: Get a local service listing
      responses:
        "200":
          description: Service listing with portfolio
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
        "404":
          description: Service not found
    delete:
      operationId: deleteService
      tags: [services]
      summary: Delete an owned service listing
      responses:
        "204":
          description: Service deleted
        "401":
          description: Authentication required
        "404":
          description: Service not found or not owned by current user
  /services/{serviceId}/reports:
    post:
      operationId: reportServiceListing
      tags: [services]
      summary: Report a local-service listing to the moderation team
      parameters:
        - name: serviceId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrustReportBody"
      responses:
        "201":
          description: Report submitted
        "400":
          description: Invalid report or reporting your own listing
        "401":
          description: Authentication required
        "404":
          description: Service listing not found

  /services/{id}/location:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    patch:
      operationId: updateServiceLocation
      tags: [services]
      summary: Update or remove a service listing's private location
      description: Only the listing owner can update this location. Exact coordinates are never returned by public service endpoints.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                latitude:
                  type: ["number", "null"]
                  minimum: -90
                  maximum: 90
                longitude:
                  type: ["number", "null"]
                  minimum: -180
                  maximum: 180
              required: [latitude, longitude]
      responses:
        "200":
          description: Service location updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  hasServiceLocation:
                    type: boolean
                required: [hasServiceLocation]
        "401":
          description: Authentication required
        "404":
          description: Service listing not found

  # Jobs
  /jobs:
    get:
      operationId: listJobs
      tags: [jobs]
      summary: List job listings with filters
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: skill
          in: query
          schema:
            type: string
        - name: location
          in: query
          schema:
            type: string
        - name: remote
          in: query
          schema:
            type: boolean
        - name: minBudget
          in: query
          schema:
            type: number
        - name: maxBudget
          in: query
          schema:
            type: number
        - name: status
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
        - name: offset
          in: query
          schema:
            type: integer
        - name: budgetType
          in: query
          schema:
            type: string
            enum: [fixed, hourly]
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [newest, oldest, budget_asc, budget_desc]
      responses:
        "200":
          description: List of jobs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobListResponse"
    post:
      operationId: createJob
      tags: [jobs]
      summary: Post a new job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateJobBody"
      responses:
        "201":
          description: Job created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"

  /jobs/{id}:
    get:
      operationId: getJob
      tags: [jobs]
      summary: Get a job by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          description: Not found
    patch:
      operationId: updateJob
      tags: [jobs]
      summary: Update a job before proposals are received
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateJobBody"
      responses:
        "200":
          description: Job updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "409":
          description: The job already has proposals or its status cannot be changed
    delete:
      operationId: deleteJob
      tags: [jobs]
      summary: Delete a job before proposals are received
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "409":
          description: The job already has proposals

  /jobs/{jobId}/agreement:
    parameters:
      - name: jobId
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    get:
      operationId: getProjectAgreement
      tags: [jobs]
      summary: Get the agreement for the accepted project participants
      responses:
        "200":
          description: Current agreement and accepted bid amount
          content:
            application/json:
              schema:
                type: object
                properties:
                  agreement:
                    oneOf:
                      - $ref: "#/components/schemas/ProjectAgreement"
                      - type: "null"
                  acceptedAmount:
                    type: number
                required: [agreement, acceptedAmount]
        "401":
          description: Authentication required
        "404":
          description: Project not found
    put:
      operationId: saveProjectAgreement
      tags: [jobs]
      summary: Set or update the project scope and deadline for freelancer confirmation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                scope:
                  type: string
                  minLength: 20
                  maxLength: 5000
                deadline:
                  type: string
                  format: date
              required: [scope, deadline]
      responses:
        "200":
          description: Agreement sent for confirmation
        "400":
          description: Invalid scope or deadline
        "401":
          description: Authentication required
        "409":
          description: Agreement can no longer be changed

  /jobs/{jobId}/agreement/confirm:
    parameters:
      - name: jobId
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    post:
      operationId: confirmProjectAgreement
      tags: [jobs]
      summary: Confirm the proposed project scope and deadline as the accepted freelancer
      responses:
        "200":
          description: Agreement confirmed by both parties
        "401":
          description: Authentication required
        "404":
          description: Project not found
        "409":
          description: No agreement is awaiting confirmation

  /jobs/{jobId}/agreement/request-changes:
    parameters:
      - name: jobId
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    post:
      operationId: requestProjectAgreementChanges
      tags: [jobs]
      summary: Request changes to the proposed agreement as the accepted freelancer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
                  type: string
                  minLength: 5
                  maxLength: 2000
              required: [note]
      responses:
        "200":
          description: Requested changes sent to the client
        "401":
          description: Authentication required
        "404":
          description: Project not found
        "409":
          description: Agreement is not awaiting review

  /jobs/{jobId}/submissions:
    get:
      operationId: listJobWorkSubmissions
      tags: [jobs]
      summary: List work submissions for a project participant
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Work submission history
          content:
            application/json:
              schema:
                type: object
                properties:
                  submissions:
                    type: array
                    items:
                      $ref: "#/components/schemas/JobWorkSubmission"
                required: [submissions]
    post:
      operationId: submitJobWork
      tags: [jobs]
      summary: Submit project work for client review
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitJobWorkBody"
      responses:
        "201":
          description: Work submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobWorkSubmission"

  /jobs/{jobId}/submissions/{submissionId}/revisions:
    post:
      operationId: requestJobWorkRevision
      tags: [jobs]
      summary: Request a revision to submitted work
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: integer
        - name: submissionId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestWorkRevisionBody"
      responses:
        "200":
          description: Revision requested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobWorkSubmission"

  /jobs/{jobId}/submissions/{submissionId}/approve:
    post:
      operationId: approveJobWork
      tags: [jobs]
      summary: Approve a work submission and prepare escrow release
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: integer
        - name: submissionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Work approved
          content:
            application/json:
              schema:
                type: object
                properties:
                  submission:
                    $ref: "#/components/schemas/JobWorkSubmission"
                  jobStatus:
                    type: string
                required: [submission, jobStatus]

  /jobs/{jobId}/submissions/{submissionId}/attachments/{attachmentId}:
    get:
      operationId: getJobWorkAttachment
      tags: [jobs]
      summary: Download a project work attachment as a participant
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: integer
        - name: submissionId
          in: path
          required: true
          schema:
            type: integer
        - name: attachmentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Attachment content
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary

  /jobs/my:
    get:
      operationId: listMyJobs
      tags: [jobs]
      summary: List jobs posted by the current client
      responses:
        "200":
          description: My jobs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobListResponse"

  # Proposals
  /proposals:
    get:
      operationId: listMyProposals
      tags: [proposals]
      summary: List proposals submitted by the current freelancer
      responses:
        "200":
          description: My proposals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposalListResponse"
    post:
      operationId: createProposal
      tags: [proposals]
      summary: Submit a proposal for a job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProposalBody"
      responses:
        "201":
          description: Proposal created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Proposal"

  /proposals/{id}:
    get:
      operationId: getProposal
      tags: [proposals]
      summary: Get a proposal by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Proposal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Proposal"
        "404":
          description: Not found
    patch:
      operationId: updateProposalStatus
      tags: [proposals]
      summary: Update a proposal status (accept/reject)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProposalStatusBody"
      responses:
        "200":
          description: Updated proposal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Proposal"

  /jobs/{jobId}/proposals:
    get:
      operationId: listJobProposals
      tags: [proposals]
      summary: List proposals for a specific job (client view)
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Job proposals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposalListResponse"

  # Messages
  /messages/conversations:
    get:
      operationId: listConversations
      tags: [messages]
      summary: List conversations for the current user
      responses:
        "200":
          description: Conversations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationListResponse"

  /messages/conversations/{conversationId}:
    get:
      operationId: getConversationMessages
      tags: [messages]
      summary: Get messages in a conversation
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
        - name: offset
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageListResponse"

  /messages/conversations/{conversationId}/typing:
    get:
      operationId: getConversationTyping
      tags: [messages]
      summary: Check whether another participant is typing
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Typing state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TypingStatus"
    post:
      operationId: updateConversationTyping
      tags: [messages]
      summary: Update current participant typing state
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                isTyping:
                  type: boolean
              required: [isTyping]
      responses:
        "204":
          description: Typing state updated

  /messages/conversations/{conversationId}/mute:
    patch:
      operationId: updateConversationMute
      tags: [messages]
      summary: Set the current user's mute preference for a conversation
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                muted:
                  type: boolean
              required: [muted]
      responses:
        "200":
          description: Updated mute preference
          content:
            application/json:
              schema:
                type: object
                properties:
                  muted:
                    type: boolean
                required: [muted]

  /messages/conversations/{conversationId}/block:
    post:
      operationId: blockConversationUser
      tags: [messages]
      summary: Block the other participant in a conversation
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User blocked
          content:
            application/json:
              schema:
                type: object
                properties:
                  blocked:
                    type: boolean
                required: [blocked]
    delete:
      operationId: unblockConversationUser
      tags: [messages]
      summary: Unblock the other participant in a conversation
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User unblocked
          content:
            application/json:
              schema:
                type: object
                properties:
                  blocked:
                    type: boolean
                required: [blocked]

  /messages/conversations/{conversationId}/reports:
    post:
      operationId: reportConversationUser
      tags: [messages]
      summary: Report the other participant in a conversation
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportUserBody"
      responses:
        "201":
          description: User report submitted
          content:
            application/json:
              schema:
                type: object
                properties:
                  reported:
                    type: boolean
                required: [reported]

  /messages/{messageId}/reports:
    post:
      operationId: reportMessage
      tags: [messages]
      summary: Report a message
      parameters:
        - name: messageId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportMessageBody"
      responses:
        "201":
          description: Message report submitted
          content:
            application/json:
              schema:
                type: object
                properties:
                  reported:
                    type: boolean
                required: [reported]

  /messages:
    post:
      operationId: sendMessage
      tags: [messages]
      summary: Send a message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageBody"
      responses:
        "201":
          description: Message sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"

  # Notifications
  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List notifications for the current user
      parameters:
        - name: unreadOnly
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationListResponse"

  /notifications/{id}/read:
    patch:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark a notification as read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Notification marked read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"

  /notifications/read-all:
    patch:
      operationId: markAllNotificationsRead
      tags: [notifications]
      summary: Mark all notifications as read
      responses:
        "200":
          description: All marked read

  # Reviews
  /reviews:
    post:
      operationId: createReview
      tags: [reviews]
      summary: Create a review for a completed job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReviewBody"
      responses:
        "201":
          description: Review created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"

  /reviews/profile/{profileId}:
    get:
      operationId: listProfileReviews
      tags: [reviews]
      summary: Get reviews for a profile
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Reviews
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewListResponse"

  # Dashboard
  /dashboard/freelancer:
    get:
      operationId: getFreelancerDashboard
      tags: [dashboard]
      summary: Get freelancer dashboard summary
      responses:
        "200":
          description: Freelancer dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FreelancerDashboard"

  /dashboard/client:
    get:
      operationId: getClientDashboard
      tags: [dashboard]
      summary: Get client dashboard summary
      responses:
        "200":
          description: Client dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientDashboard"

  # Payments (Paystack escrow)
  /payments:
    get:
      operationId: listPayments
      tags: [payments]
      summary: List payment transactions for current user
      responses:
        "200":
          description: Payments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentListResponse"
    post:
      operationId: createPayment
      tags: [payments]
      summary: Initialize a Paystack payment and create escrow record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePaymentBody"
      responses:
        "201":
          description: Payment initialized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InitializePaymentResponse"

  /payments/verify/{reference}:
    get:
      operationId: verifyPayment
      tags: [payments]
      summary: Verify a Paystack payment and mark as escrowed
      parameters:
        - name: reference
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Payment verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"

  /payments/payout-method:
    get:
      operationId: getPayoutMethod
      tags: [payments]
      summary: Get the current freelancer's masked payout method
      responses:
        "200":
          description: The freelancer's payout method, if configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayoutMethodResponse"
    put:
      operationId: savePayoutMethod
      tags: [payments]
      summary: Securely save or replace the current freelancer's payout details for later verification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayoutMethodBody"
      responses:
        "200":
          description: Payout method saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayoutMethodResponse"

  /payments/payout-method/verify:
    post:
      operationId: verifyPayoutMethod
      tags: [payments]
      summary: Verify the current freelancer's saved payout details with Paystack
      responses:
        "200":
          description: Payout method verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayoutMethodResponse"

  /payments/{id}/release:
    patch:
      operationId: releasePayment
      tags: [payments]
      summary: Release escrowed funds to freelancer via Paystack transfer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Payment released
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"

  /payments/webhook:
    post:
      operationId: paystackWebhook
      tags: [payments]
      summary: Paystack webhook receiver
      responses:
        "200":
          description: Acknowledged

  /payments/banks:
    get:
      operationId: listPaystackBanks
      tags: [payments]
      summary: List Ghana banks and mobile money providers supported by Paystack
      responses:
        "200":
          description: Bank list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaystackBankListResponse"

  /payments/resolve-account:
    post:
      operationId: resolvePaystackAccount
      tags: [payments]
      summary: Verify the current freelancer's payout account without returning account-holder details
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveAccountRequest"
      responses:
        "200":
          description: Payout account verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolveAccountResponse"
        "422":
          description: Account not found or invalid details

  # Saved Jobs
  /saved-jobs:
    get:
      operationId: listSavedJobs
      tags: [jobs]
      summary: List saved jobs for current user
      responses:
        "200":
          description: Saved jobs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedJobListResponse"
    post:
      operationId: saveJob
      tags: [jobs]
      summary: Save a job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveJobBody"
      responses:
        "201":
          description: Job saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedJob"

  /saved-jobs/{jobId}:
    delete:
      operationId: unsaveJob
      tags: [jobs]
      summary: Remove a saved job
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Unsaved

  # Admin
  /admin/users:
    get:
      operationId: adminListUsers
      tags: [admin]
      summary: Admin - list all users
      parameters:
        - name: role
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
        - name: offset
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: All users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserListResponse"

  /admin/users/{id}/block:
    patch:
      operationId: adminBlockUser
      tags: [admin]
      summary: Admin - block or unblock a user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminBlockUserBody"
      responses:
        "200":
          description: User updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"

  /admin/users/{id}/verify:
    patch:
      operationId: adminVerifyUser
      tags: [admin]
      summary: Admin - set verified/top-rated status on a user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminVerifyUserBody"
      responses:
        "200":
          description: User updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"

  /admin/users/{id}/role:
    patch:
      operationId: adminChangeUserRole
      tags: [admin]
      summary: Admin - change a user's role
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminChangeUserRoleBody"
      responses:
        "200":
          description: User updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"

  /admin/jobs:
    get:
      operationId: adminListJobs
      tags: [admin]
      summary: Admin - list all jobs
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: flagged
          in: query
          schema:
            type: boolean
        - name: limit
          in: query
          schema:
            type: integer
        - name: offset
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: All jobs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobListResponse"

  /admin/jobs/{id}/flag:
    patch:
      operationId: adminFlagJob
      tags: [admin]
      summary: Admin - flag or unflag a job
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminFlagBody"
      responses:
        "200":
          description: Job flagged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"

  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [admin]
      summary: Admin - platform stats overview
      responses:
        "200":
          description: Platform stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"

  /admin/audit-logs:
    get:
      operationId: getAdminAuditLogs
      tags: [admin]
      summary: Admin - fetch audit log entries
      parameters:
        - in: query
          name: action
          schema:
            type: string
        - in: query
          name: entityType
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
        - in: query
          name: offset
          schema:
            type: integer
      responses:
        "200":
          description: Audit log entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditLogListResponse"

  /admin/user-reports:
    get:
      operationId: adminListUserReports
      tags: [admin]
      summary: List user safety reports
      responses:
        "200":
          description: User reports for moderation
          content:
            application/json:
              schema:
                type: object
                properties:
                  reports:
                    type: array
                    items:
                      $ref: "#/components/schemas/AdminUserReport"
                required: [reports]

  /admin/user-reports/{id}:
    patch:
      operationId: adminUpdateUserReport
      tags: [admin]
      summary: Update a user report moderation status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [open, in_review, resolved]
              required: [status]
      responses:
        "200":
          description: Updated user report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserReport"

  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [storage]
      summary: Request a presigned URL for file upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestUploadUrlBody"
      responses:
        "200":
          description: Presigned upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestUploadUrlResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Profile:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: string
        role:
          type: string
        name:
          type: string
          maxLength: 120
        bio:
          type: ["string", "null"]
        avatarUrl:
          type: ["string", "null"]
        location:
          type: ["string", "null"]
        skills:
          type: array
          items:
            type: string
        languages:
          type: array
          items:
            type: string
        certifications:
          type: array
          items:
            type: string
        companyName:
          type: ["string", "null"]
        companyWebsite:
          type: ["string", "null"]
        industry:
          type: ["string", "null"]
        companySize:
          type: ["string", "null"]
        hiringBudget:
          type: ["string", "null"]
        hiringNeeds:
          type: ["string", "null"]
        hourlyRate:
          type: ["number", "null"]
        fixedRate:
          type: ["number", "null"]
        category:
          type: ["string", "null"]
        portfolioItems:
          type: array
          items:
            $ref: "#/components/schemas/PortfolioItem"
        avgRating:
          type: ["number", "null"]
        totalReviews:
          type: integer
        featured:
          type: boolean
        isBlocked:
          type: boolean
        isVerified:
          type: boolean
        isTopRated:
          type: boolean
        resumeUrl:
          type: ["string", "null"]
        verificationDocUrl:
          type: ["string", "null"]
        verificationStatus:
          type: string
        completedJobs:
          type: integer
        createdAt:
          type: string
      required:
        - id
        - userId
        - role
        - name
        - skills
        - portfolioItems
        - totalReviews
        - featured
        - isBlocked
        - isVerified
        - isTopRated
        - verificationStatus
        - completedJobs
        - createdAt

    MyProfile:
      allOf:
        - $ref: "#/components/schemas/Profile"
        - type: object
          properties:
            legalName:
              type: ["string", "null"]
            nameChangedAt:
              type: ["string", "null"]
              format: date-time

    PortfolioItem:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: ["string", "null"]
        imageUrl:
          type: ["string", "null"]
        projectUrl:
          type: ["string", "null"]
      required:
        - id
        - title

    UpsertProfileBody:
      type: object
      properties:
        role:
          type: string
        name:
          type: string
          minLength: 2
          maxLength: 120
        bio:
          type: ["string", "null"]
        avatarUrl:
          type: ["string", "null"]
        location:
          type: ["string", "null"]
        skills:
          type: array
          items:
            type: string
        languages:
          type: array
          items:
            type: string
        certifications:
          type: array
          items:
            type: string
        companyName:
          type: ["string", "null"]
        companyWebsite:
          type: ["string", "null"]
        industry:
          type: ["string", "null"]
        companySize:
          type: ["string", "null"]
        hiringBudget:
          type: ["string", "null"]
        hiringNeeds:
          type: ["string", "null"]
        hourlyRate:
          type: ["number", "null"]
        fixedRate:
          type: ["number", "null"]
        category:
          type: ["string", "null"]
        portfolioItems:
          type: array
          items:
            $ref: "#/components/schemas/PortfolioItem"
        resumeUrl:
          type: ["string", "null"]
        verificationDocUrl:
          type: ["string", "null"]
      required:
        - role
        - name

    FreelancerListResponse:
      type: object
      properties:
        freelancers:
          type: array
          items:
            $ref: "#/components/schemas/Profile"
        total:
          type: integer
      required:
        - freelancers
        - total

    Job:
      type: object
      properties:
        id:
          type: integer
        clientId:
          type: integer
        title:
          type: string
        description:
          type: string
        category:
          type: string
        skills:
          type: array
          items:
            type: string
        budgetMin:
          type: ["number", "null"]
        budgetMax:
          type: ["number", "null"]
        budgetType:
          type: string
        location:
          type: ["string", "null"]
        remote:
          type: boolean
        deadline:
          type: ["string", "null"]
        status:
          type: string
          enum: [open, awaiting_funding, payment_pending, in_progress, awaiting_approval, awaiting_release, completed, cancelled, closed]
        isFlagged:
          type: boolean
        proposalCount:
          type: integer
        clientName:
          type: ["string", "null"]
        clientAvatarUrl:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - clientId
        - title
        - description
        - category
        - skills
        - budgetType
        - remote
        - status
        - isFlagged
        - proposalCount
        - createdAt
        - updatedAt

    CreateJobBody:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        category:
          type: string
        skills:
          type: array
          items:
            type: string
        budgetMin:
          type: ["number", "null"]
        budgetMax:
          type: ["number", "null"]
        budgetType:
          type: string
        location:
          type: ["string", "null"]
        remote:
          type: boolean
        deadline:
          type: ["string", "null"]
      required:
        - title
        - description
        - category
        - skills
        - budgetType
        - remote

    UpdateJobBody:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        category:
          type: string
        skills:
          type: array
          items:
            type: string
        budgetMin:
          type: ["number", "null"]
        budgetMax:
          type: ["number", "null"]
        budgetType:
          type: string
        location:
          type: ["string", "null"]
        remote:
          type: boolean
        deadline:
          type: ["string", "null"]
        status:
          type: string
          enum: [closed]

    JobListResponse:
      type: object
      properties:
        jobs:
          type: array
          items:
            $ref: "#/components/schemas/Job"
        total:
          type: integer
      required:
        - jobs
        - total

    JobWorkAttachment:
      type: object
      properties:
        id:
          type: integer
        submissionId:
          type: integer
        objectPath:
          type: string
        fileName:
          type: string
        contentType:
          type: string
        createdAt:
          type: string
      required: [id, submissionId, objectPath, fileName, contentType, createdAt]

    JobWorkSubmission:
      type: object
      properties:
        id:
          type: integer
        jobId:
          type: integer
        freelancerId:
          type: integer
        note:
          type: string
        status:
          type: string
          enum: [awaiting_approval, revision_requested, approved]
        revisionNote:
          type: [string, "null"]
        createdAt:
          type: string
        updatedAt:
          type: string
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/JobWorkAttachment"
      required: [id, jobId, freelancerId, note, status, createdAt, updatedAt, attachments]

    ProjectAgreement:
      type: object
      properties:
        id:
          type: integer
        jobId:
          type: integer
        proposalId:
          type: integer
        clientId:
          type: integer
        freelancerId:
          type: integer
        scope:
          type: string
        deadline:
          type: string
          format: date
        amount:
          type: number
        status:
          type: string
          enum: [pending_freelancer, changes_requested, confirmed]
        changeRequest:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, jobId, proposalId, clientId, freelancerId, scope, deadline, amount, status, createdAt, updatedAt]

    SubmitJobWorkBody:
      type: object
      properties:
        note:
          type: string
          minLength: 10
          maxLength: 5000
        attachments:
          type: array
          maxItems: 5
          items:
            type: object
            properties:
              objectPath:
                type: string
              fileName:
                type: string
              contentType:
                type: string
            required: [objectPath, fileName, contentType]
      required: [note]

    RequestWorkRevisionBody:
      type: object
      properties:
        note:
          type: string
          minLength: 5
          maxLength: 2000
      required: [note]

    Proposal:
      type: object
      properties:
        id:
          type: integer
        jobId:
          type: integer
        freelancerId:
          type: integer
        coverLetter:
          type: string
        bidAmount:
          type: number
        status:
          type: string
        freelancerName:
          type: ["string", "null"]
        freelancerAvatarUrl:
          type: ["string", "null"]
        freelancerLocation:
          type: ["string", "null"]
        freelancerSkills:
          type: array
          items:
            type: string
        freelancerAvgRating:
          type: ["number", "null"]
        jobTitle:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - jobId
        - freelancerId
        - coverLetter
        - bidAmount
        - status
        - freelancerSkills
        - createdAt
        - updatedAt

    CreateProposalBody:
      type: object
      properties:
        jobId:
          type: integer
        coverLetter:
          type: string
        bidAmount:
          type: number
      required:
        - jobId
        - coverLetter
        - bidAmount

    UpdateProposalStatusBody:
      type: object
      properties:
        status:
          type: string
          enum: [under_review, accepted, rejected]
      required:
        - status

    ProposalListResponse:
      type: object
      properties:
        proposals:
          type: array
          items:
            $ref: "#/components/schemas/Proposal"
        total:
          type: integer
      required:
        - proposals
        - total

    Conversation:
      type: object
      properties:
        id:
          type: integer
        otherUserId:
          type: integer
        otherUserName:
          type: string
        otherUserAvatarUrl:
          type: ["string", "null"]
        isMuted:
          type: boolean
        isBlockedByMe:
          type: boolean
        hasBlockedMe:
          type: boolean
        lastMessage:
          type: ["string", "null"]
        lastMessageAt:
          type: ["string", "null"]
        unreadCount:
          type: integer
        job:
          oneOf:
            - $ref: "#/components/schemas/ConversationJob"
            - type: "null"
      required:
        - id
        - otherUserId
        - otherUserName
        - isMuted
        - isBlockedByMe
        - hasBlockedMe
        - unreadCount
        - job

    ConversationJob:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        status:
          type: string
        budgetMin:
          type: ["number", "null"]
        budgetMax:
          type: ["number", "null"]
        budgetType:
          type: string
        proposalId:
          type: ["integer", "null"]
        proposalBidAmount:
          type: ["number", "null"]
      required:
        - id
        - title
        - status
        - budgetMin
        - budgetMax
        - budgetType
        - proposalId
        - proposalBidAmount

    ConversationListResponse:
      type: object
      properties:
        conversations:
          type: array
          items:
            $ref: "#/components/schemas/Conversation"
      required:
        - conversations

    Message:
      type: object
      properties:
        id:
          type: integer
        conversationId:
          type: integer
        senderId:
          type: integer
        content:
          type: string
        attachmentUrl:
